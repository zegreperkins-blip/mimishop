{% extends "base.html" %}{% block content %}<section class="section narrow"><h1>{% if product.id %}Modifier{% else %}Ajouter{% endif %} un produit</h1><form method="post" enctype="multipart/form-data" class="checkout-form"><label>Nom du produit<input name="name" required value="{{ product.name or '' }}"></label><label>Catégorie<select name="category">{% for c in ['Robes','Abayas','Slips','Ensembles','Accessoires','Autres'] %}<option {% if product.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label><label>Description<textarea name="description">{{ product.description or '' }}</textarea></label><label>Prix en FCFA<input type="number" min="0" name="price" required value="{{ product.price or 0 }}"></label><label>Quantité en stock<input type="number" min="0" name="stock" value="{{ product.stock or 0 }}"></label><label>Photo du produit<input type="file" name="image_file" accept=".png,.jpg,.jpeg,.webp"></label><label>Ou URL de l'image<input name="image_url" placeholder="https://..." value=""></label><label class="check"><input type="checkbox" name="featured" {% if product.featured %}checked{% endif %}> Mettre à la une</label><button class="btn black full">Enregistrer le produit</button></form></section>{% endblock %}
